name: Dashboard layout preview (DEMO, synthetic numbers)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render DEMO dashboard (no network, no real data)
        run: python scripts/dashboard.py --demo >> "$GITHUB_STEP_SUMMARY"
